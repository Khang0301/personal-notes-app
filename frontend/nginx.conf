server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path that isn't a real
    # file (e.g. /notes, /categories) must still be served index.html,
    # letting React Router take over and render the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
