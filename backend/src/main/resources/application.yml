server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=notesapp;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong@Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-please-change-me}
    expiration-ms: 86400000 # 24 hours

cors:
  allowed-origin: ${FRONTEND_URL:http://localhost:5173}
